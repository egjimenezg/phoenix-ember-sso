name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-test:
    name: Elixir API - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sso_server_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      oauth_mock:
        image: ghcr.io/navikt/mock-oauth2-server:4.0.0
        ports:
          - 8090:8080
        env:
          SERVER_PORT: 8080
          JSON_CONFIG: >-
            {"interactiveLogin":false,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"google","tokenExpiry":3600,"requestMappings":[{"requestParam":"scope","match":"openid","claims":{"sub":"107418193","email":"testuser@example.com","name":"Test User","given_name":"Test","family_name":"User","email_verified":true}}]}]}
        options: >-
          --health-cmd "wget -qO /dev/null http://localhost:8080/google/.well-known/openid-configuration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: api/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('api/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache compiled build
        uses: actions/cache@v4
        with:
          path: api/_build
          key: ${{ runner.os }}-build-${{ hashFiles('api/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Check compilation (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run migrations
        run: mix ecto.migrate

      - name: Run tests
        run: mix test --include integration
        env:
          OAUTH_MOCK_BASE_URL: http://localhost:8090/google
