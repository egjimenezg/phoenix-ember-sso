services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sso_server_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  oauth_mock:
    image: ghcr.io/navikt/mock-oauth2-server:4.0.0
    ports:
      - "8090:8080"
    environment:
      SERVER_PORT: 8080
      # Simulates Google's OIDC issuer at http://localhost:8080/google
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "google",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "openid",
                  "claims": {
                    "sub": "107418193",
                    "email": "testuser@example.com",
                    "name": "Test User",
                    "given_name": "Test",
                    "family_name": "User",
                    "email_verified": true
                  }
                }
              ]
            }
          ]
        }

volumes:
  postgres_data:
